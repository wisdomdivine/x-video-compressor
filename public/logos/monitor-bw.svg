<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- Ground Cast Shadow -->
  <path d="M48 185 L180 185 L215 158 L110 158 Z" fill="#1C1917" />
  <path d="M52 185 C45 185 40 192 48 196 L108 206 C115 207 185 186 215 160 L180 185 Z" fill="#1C1917" />

  <!-- Chassis Top Face -->
  <path d="M55 95 L95 62 C98 60 104 60 108 60 L172 60 C176 60 182 63 185 66 L175 95 Z" fill="#FFFFFF" stroke="#1C1917" stroke-width="3.5" stroke-linejoin="round" />
  
  <!-- Chassis Top Handle/Recess -->
  <path d="M110 68 L152 68 L148 74 L106 74 Z" fill="#1C1917" />

  <!-- Left Side Face -->
  <path d="M55 95 L112 188 C114 191 112 195 106 195 L56 182 C50 180 46 174 46 168 L46 102 C46 96 50 93 55 95 Z" fill="#F4F4F4" stroke="#1C1917" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Side Vents / Slats -->
  <line x1="60" y1="150" x2="88" y2="157" stroke="#1C1917" stroke-width="3" stroke-linecap="round" />
  <line x1="60" y1="160" x2="88" y2="167" stroke="#1C1917" stroke-width="3" stroke-linecap="round" />
  <line x1="60" y1="170" x2="88" y2="177" stroke="#1C1917" stroke-width="3" stroke-linecap="round" />

  <!-- Rotary Knob on Side -->
  <ellipse cx="68" cy="122" rx="10" ry="12" fill="#FFFFFF" stroke="#1C1917" stroke-width="3" />
  <ellipse cx="66" cy="122" rx="6" ry="8" fill="#1C1917" />
  <line x1="62" y1="117" x2="65" y2="120" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <!-- Screws on Left Face -->
  <circle cx="50" cy="103" r="1.5" fill="#1C1917" />
  <circle cx="106" cy="189" r="1.5" fill="#1C1917" />

  <!-- Front Bezel -->
  <path d="M55 95 L175 95 C180 95 184 99 186 104 L196 150 C198 156 194 162 188 163 L116 192 C112 194 107 192 105 187 L53 103 C51 98 53 95 55 95 Z" fill="#1C1917" stroke="#1C1917" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Screen Aperture Mask -->
  <clipPath id="screenClipBw">
    <path d="M66 105 L170 105 L186 146 L116 179 L66 105 Z" />
  </clipPath>

  <!-- Screen Content Group -->
  <g clip-path="url(#screenClipBw)">
    <!-- Base Screen Color -->
    <rect x="50" y="90" width="150" height="100" fill="#FFFFFF" />
    
    <!-- Pattern Vertical Stripes -->
    <polygon points="62,90 77,90 87,190 72,190" fill="#E5E5E5" />
    <polygon points="77,90 92,90 102,190 87,190" fill="#CCCCCC" />
    <polygon points="92,90 107,90 117,190 102,190" fill="#B3B3B3" />
    <polygon points="107,90 122,90 132,190 117,190" fill="#808080" />
    <polygon points="122,90 137,90 147,190 132,190" fill="#4D4D4D" />
    <polygon points="137,90 152,90 162,190 147,190" fill="#262626" />
    <polygon points="152,90 175,90 185,190 162,190" fill="#000000" />

    <!-- Screen Status Badge -->
    <polygon points="90,140 160,140 154,162 84,162" fill="#000000" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="120" y="156" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="3">REC</text>

    <!-- Bottom White Segment -->
    <polygon points="160,140 180,140 174,162 154,162" fill="#FFFFFF" />
  </g>

  <!-- Screen Frame Inner Border -->
  <path d="M66 105 L170 105 L186 146 L116 179 L66 105 Z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
</svg>

